[package]
name = "enrg-mvp"
version = "0.1.0"
description = "ENRG Protocol MVP"
edition = "2021"
rust-version = "1.75.0"

[lib]
crate-type = ["cdylib", "lib"]
test = false

[lints.rust]
# The cfg values (no-entrypoint, custom-heap, custom-panic, anchor-debug,
# no-idl, no-log-ix-name) are generated inside Anchor/Solana macros, which we
# do not control, so the warning is silenced at the crate level.
unexpected_cfgs = { level = "allow", check-cfg = [
    "cfg(no_entrypoint)",
    "cfg(custom_heap)",
    "cfg(custom_panic)",
    "cfg(anchor_debug)",
    "cfg(no_idl)",
    "cfg(no_log_ix_name)",
] }

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

# default-features = false: disable token_2022/token_2022_extensions, which pull
# spl-token-2022 -> solana-zk-sdk -> crypto-common 0.1.7 with huge arrays
# ([u16; 2048], [u32; 2048], etc.) that break the 4096-byte stack limit.
anchor-spl = { version = "0.32.1", default-features = false, features = ["token"] }
# SHA-256 for the quorum proof_hash (solana-program 2.x split the hashers out).
solana-sha256-hasher = "=2.3.0"

hex = "0.4"

# Reading the Instructions sysvar for Ed25519 signature verification
# (Axis pattern: precompile instruction in the transaction + sysvar).
solana-instructions-sysvar = "2.2.2"

[dev-dependencies]
# anchor-lang is reused by integration tests (tests/) for OracleReport/Pubkey.
anchor-lang = "0.32.1"
# BorrowedInstruction types for host-side sysvar unit tests.
solana-instruction = "2.3.3"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test = []
