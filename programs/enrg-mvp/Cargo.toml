[package]
name = "enrg-mvp"
version = "0.1.0"
description = "ENRG Protocol MVP"
edition = "2021"
rust-version = "1.75.0"

[lib]
crate-type = ["cdylib", "lib"]
test = false

[lints]
workspace = true

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token"] }
hex = "0.4"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
test = []
