version: '3.9'

services:
  oracle:
    # P1 (audit 2026-08-18): build context is the repository root because server.js
    # lives in the root, not in oracle/.
    build:
      context: .
      dockerfile: oracle/Dockerfile
    container_name: enrg-oracle
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # PROGRAM_ID / MINT_ADDRESS are deliberately absent: the program id is baked
      # into the binary (`declare_id!`) and mirrored in server.js, and the SRC mint
      # is the PDA [b"src-mint"]. They used to be passed here but were never read.
      # H-1: prefer passing the KEY PATH rather than the key itself in the env.
      FOUNDER_KEY_PATH: ${FOUNDER_KEY_PATH:-}
      FOUNDER_KEY: ${FOUNDER_KEY:-}
      RPC_ENDPOINT: ${RPC_ENDPOINT:-}
      # P0-3 (audit 2026-08-30): comma-separated RPC failover list.
      RPC_ENDPOINTS: ${RPC_ENDPOINTS:-}
      # P0-2 (audit 2026-08-30): mint queue knobs.
      MINT_QUEUE_MAX: ${MINT_QUEUE_MAX:-10000}
      MINT_MAX_ATTEMPTS: ${MINT_MAX_ATTEMPTS:-8}
      # P3-2 (audit 2026-08-30): mint only proofs >= this energy (Wh).
      MINT_MIN_ENERGY_WH: ${MINT_MIN_ENERGY_WH:-0}
      # P1 (audit 2026-09-21): the SQLite file lives in the mounted ./data directory
      # (see the volumes note below) — never point this at ./enrg.db, which is
      # gitignored and would be created as a directory on a fresh clone.
      ENRG_SQLITE_PATH: /app/data/enrg.db
    volumes:
      # Persistence of the SQLite store and OTA images (ADR-0008).
      # P1 (audit 2026-09-21): mount a DIRECTORY, not ./enrg.db — that file is
      # gitignored, so on a fresh clone Docker would silently create a *directory*
      # called enrg.db and better-sqlite3 would fail at startup. `./data` exists
      # in the repository (data/.gitkeep) and the path is set explicitly above.
      - ./data:/app/data
      - ./firmware/updates:/app/firmware/updates
    restart: unless-stopped

  manifest-registry:
    build:
      context: ./oracle/registry
      dockerfile: Dockerfile
    container_name: enrg-manifest-registry
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      # H-5: the key is required (≥32 chars) — without it the service fails at startup.
      REGISTRY_ADMIN_KEY: ${REGISTRY_ADMIN_KEY}
      SERVICE_NAME: enrg-manifest-registry
    restart: unless-stopped
