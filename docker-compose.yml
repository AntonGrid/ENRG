version: '3.9'

services:
  oracle:
    # P1 (audit 2026-08-18): build context is the repository root because server.js
    # lives in the root, not in oracle/.
    build:
      context: .
      dockerfile: oracle/Dockerfile
    container_name: enrg-oracle
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PROGRAM_ID: ${PROGRAM_ID:-}
      MINT_ADDRESS: ${MINT_ADDRESS:-}
      # H-1: prefer passing the KEY PATH rather than the key itself in the env.
      FOUNDER_KEY_PATH: ${FOUNDER_KEY_PATH:-}
      FOUNDER_KEY: ${FOUNDER_KEY:-}
      RPC_ENDPOINT: ${RPC_ENDPOINT:-}
      # P0-3 (audit 2026-08-30): comma-separated RPC failover list.
      RPC_ENDPOINTS: ${RPC_ENDPOINTS:-}
      # P0-2 (audit 2026-08-30): mint queue knobs.
      MINT_QUEUE_MAX: ${MINT_QUEUE_MAX:-10000}
      MINT_MAX_ATTEMPTS: ${MINT_MAX_ATTEMPTS:-8}
      # P3-2 (audit 2026-08-30): mint only proofs >= this energy (Wh).
      MINT_MIN_ENERGY_WH: ${MINT_MIN_ENERGY_WH:-0}
    volumes:
      # Persistence of the SQLite store and OTA images (ADR-0008).
      - ./enrg.db:/app/enrg.db
      - ./firmware/updates:/app/firmware/updates
    restart: unless-stopped

  manifest-registry:
    build:
      context: ./oracle/registry
      dockerfile: Dockerfile
    container_name: enrg-manifest-registry
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      # H-5: the key is required (≥32 chars) — without it the service fails at startup.
      REGISTRY_ADMIN_KEY: ${REGISTRY_ADMIN_KEY}
      SERVICE_NAME: enrg-manifest-registry
    restart: unless-stopped
