version: '3.9'

services:
  oracle:
    # P1 (аудит 2026-08-18): build context — корень репозитория, т.к. server.js
    # лежит в корне, а не в oracle/.
    build:
      context: .
      dockerfile: oracle/Dockerfile
    container_name: enrg-oracle
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PROGRAM_ID: ${PROGRAM_ID:-}
      MINT_ADDRESS: ${MINT_ADDRESS:-}
      # H-1: предпочтительнее передавать ПУТЬ к ключу, а не сам ключ в env.
      FOUNDER_KEY_PATH: ${FOUNDER_KEY_PATH:-}
      FOUNDER_KEY: ${FOUNDER_KEY:-}
      RPC_ENDPOINT: ${RPC_ENDPOINT:-}
    volumes:
      # Персистентность SQLite-хранилища и OTA-образов (ADR-0008).
      - ./enrg.db:/app/enrg.db
      - ./firmware/updates:/app/firmware/updates
    restart: unless-stopped

  manifest-registry:
    build:
      context: ./oracle/registry
      dockerfile: Dockerfile
    container_name: enrg-manifest-registry
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      # H-5: ключ обязателен (≥32 символов) — без него сервис упадёт при старте.
      REGISTRY_ADMIN_KEY: ${REGISTRY_ADMIN_KEY}
      SERVICE_NAME: enrg-manifest-registry
    restart: unless-stopped
