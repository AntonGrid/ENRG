; ENRG Proof Sender v3 — PlatformIO конфигурация.
; Базовый env: ключ в NVS (без Secure Element). Для ATECC608:
;   pio run -e esp32dev-atecc   (требует установленную cryptoauthlib)
;
; Прошивка: firmware/esp32_proof_sender/src/esp32_proof_sender_v3.ino
; (старые v1/v2 остаются в корне папки и не собираются).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1

[env:esp32dev-atecc]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    cryptoauthlib
build_flags =
    -D ENRG_USE_ATECC608=1
