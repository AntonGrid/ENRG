; ENRG Proof Sender v3 — PlatformIO конфигурация.
; Базовый env: ключ в NVS (без Secure Element). Для ATECC608:
;   pio run -e esp32dev-atecc   (требует установленную cryptoauthlib)
; Для NXP SE050 (аппаратная Ed25519-подпись):
;   pio run -e esp32dev-se050   (требует установленную библиотеку se050)
;
; Прошивка: firmware/esp32_proof_sender/src/esp32_proof_sender_v3/esp32_proof_sender_v3.ino
; (legacy v1/v2 удалены из git — лежат в firmware/legacy/, не собираются).

[platformio]
; Исходники лежат в подпапке src/esp32_proof_sender_v3/ (имя .ino == имя папки,
; как в Arduino IDE). Без этого PlatformIO ищет .ino прямо в src/.
src_dir = src/esp32_proof_sender_v3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1

[env:esp32dev-atecc]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    cryptoauthlib
build_flags =
    -D ENRG_USE_ATECC608=1

; NXP SE050 — полная аппаратная Ed25519-подпись (ADR-0001).
; ⚠️ Требует плату с SE050 (I2C SDA/SCL: 21/22 по умолчанию) и библиотеку
;    se050. Путь — reference implementation для bring-up: сверьте имена
;    SSS-функций с версией установленной библиотеки.
[env:esp32dev-se050]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    se050
build_flags =
    -D ENRG_USE_SE050=1

; Dual-bank OTA + аппаратный анти-откат (ADR-0008).
; A/B (app0/app1 + otadata) + monotonic secure_version в eFuse.
; ⚠️ Требует ESP32 с 4MB flash; первый boot нового образа прожигает eFuse
;    (необратимо). Сборка: pio run -e esp32dev-ota
[env:esp32dev-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
build_flags =
    -D ENRG_ENABLE_HW_ANTI_ROLLBACK=1
