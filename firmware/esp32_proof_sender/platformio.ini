; ENRG Proof Sender v3 — PlatformIO конфигурация.
; Базовый env: ключ в NVS (без Secure Element). Для ATECC608:
;   pio run -e esp32dev-atecc   (требует установленную cryptoauthlib)
; Для NXP SE050 (аппаратная Ed25519-подпись):
;   pio run -e esp32dev-se050   (требует установленную библиотеку se050)
;
; Прошивка: firmware/esp32_proof_sender/src/esp32_proof_sender_v3/esp32_proof_sender_v3.ino
; (legacy v1/v2 удалены из git — лежат в firmware/legacy/, не собираются).

[platformio]
; Исходники лежат в подпапке src/esp32_proof_sender_v3/ (имя .ino == имя папки,
; как в Arduino IDE). Без этого PlatformIO ищет .ino прямо в src/.
src_dir = src/esp32_proof_sender_v3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D ENRG_SIGNER_PORT=8080
    -D ENRG_SIGNER_LAN_ONLY=1
    ; ── Облачный оракул: https://enrg-oracle.onrender.com
    ; URL и корневой CA заданы прямо в прошивке (конфиг-секция). ──

[env:esp32dev-atecc]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
    cryptoauthlib
build_flags =
    -D ENRG_USE_ATECC608=1

; NXP SE050 — полная аппаратная Ed25519-подпись (ADR-0001).
; Сборка: сначала вендоринг middleware (BSD-3-Clause, НЕ закрытая лицензия —
; см. SE050-HARDWARE-SIGNING.md §Vendoring), потом сборка tier'а:
;   firmware/esp32_proof_sender/scripts/vendor-se050.sh
;   pio run -e esp32dev-se050
; Порт под ESP32 (I2C PAL + таймеры + reset) лежит в lib/enrg_se050_port и
; коммитится; вендоренный middleware в lib/se05x — нет (128 файлов, качается
; скриптом, версия пиннута в lib/se05x/VERSION).
; ⚠️ Плата с SE050 ещё не подключалась: код компилируется и линкуется, но ни один
;    proof с чипа не подписан (docs/STATE.md). При bring-up первым делом проверьте
;    кадрирование T=1-over-I2C логическим анализатором.
; ⚠️ Требует плату с SE050 (I2C SDA/SCL: 21/22 по умолчанию).
[env:esp32dev-se050]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The middleware calls phPalEse_i2c_* / sm_sleep declared in ITS OWN headers, so
; the dependency finder cannot see lib/enrg_se050_port through them — the
; firmware includes <enrg_se050_port.h> for exactly that reason (see its header
; comment). Do not set lib_ldf_mode=off here: that also drops the framework's
; WiFi/HTTPClient libraries.
lib_ldf_mode = deep+
; The vendored middleware is NOT under lib/ on purpose: PlatformIO compiles every
; lib/ library for every environment, so a tree there breaks esp32dev /
; esp32dev-ota (they would be compiled without the SSS includes and defines).
; vendored here per-environment instead.
lib_extra_dirs = vendor
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
    ; NXP Plug & Trust middleware (sss.h + fsl_sss_se05x_*) — НЕ реестровый
    ; пакет: vendor в lib/ (SE050-HARDWARE-SIGNING.md §Vendoring).
build_flags =
    -D ENRG_USE_SE050=1
    ; Письменная фиксация, что lib/se05x содержит sss.h (иначе #error в .ino).
    -D ENRG_SE050_MIDDLEWARE_VENDORED=1
    ; Вендоренный middleware: как его собирает simw-top/cmake, но без cmake.
    -D SSS_USE_FTR_FILE=1
    -D T1oI2C=1
    ; UM11225 = the SE050 T=1-over-I2C framing (the file #errors without it).
    -D T1oI2C_UM11225=1
    -D USE_RTOS=0
    -I vendor/se05x
    -I vendor/se05x/sss/inc
    -I vendor/se05x/sss/port/default
    -I vendor/se05x/sss/ex/inc
    -I vendor/se05x/hostlib/hostLib/inc
    -I vendor/se05x/hostlib/hostLib/libCommon/infra
    -I vendor/se05x/hostlib/hostLib/libCommon/log
    -I vendor/se05x/hostlib/hostLib/libCommon/smCom
    -I vendor/se05x/hostlib/hostLib/libCommon/smCom/T1oI2C
    -I vendor/se05x/hostlib/hostLib/libCommon/nxScp
    -I vendor/se05x/hostlib/hostLib/platform/inc
    -I vendor/se05x/hostlib/hostLib/se05x_03_xx_xx
    ; Bring-up ручки (закомментировано — менять только осознанно):
    ; -D ENRG_SE050_SDA=21 -D ENRG_SE050_SCL=22 -D ENRG_SE050_I2C_HZ=100000
    ; -D ENRG_SE050_RESET_GPIO=23    ; если у платы разведён линия reset
    ; -D ENRG_SE050_PORT_DEBUG=1     ; логировать I2C PAL в Serial

; Dual-bank OTA + аппаратный анти-откат (ADR-0008).
; A/B (app0/app1 + otadata) + monotonic secure_version в eFuse.
; ⚠️ Требует ESP32 с 4MB flash; первый boot нового образа прожигает eFuse
;    (необратимо). Сборка: pio run -e esp32dev-ota
[env:esp32dev-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D ENRG_ENABLE_HW_ANTI_ROLLBACK=1
    -D ENRG_SIGNER_PORT=8080
    -D ENRG_SIGNER_LAN_ONLY=1

; ════════════════════════════════════════════════════════════════════════
;  MAINNET BUILD (P1-1, audit 2026-08-30)
;
;  The ONLY build permitted for production devices (ADR-0007 "conforming"
;  tier). Enforces, at compile time and at runtime:
;    * ENRG_MAINNET=1      → fail-closed: boot REQUIRES the NXP SE050
;                            (on-chip Ed25519) — no NVS/ATECC fallback;
;    * ENRG_MANIFEST_REQUIRED=1 → proofs are NOT sent without a valid,
;                            founder-signed Device Manifest (ADR-0004);
;    * A/B dual-bank + eFuse secure_version anti-rollback (ADR-0008).
;  Deployment MUST also enable secure boot v2 + flash encryption at
;  manufacturing (eFuse), see SE050-HARDWARE-SIGNING.md.
; ════════════════════════════════════════════════════════════════════════
[env:esp32dev-mainnet]
extends = esp32dev-se050
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
; `extends` does not carry lib_extra_dirs / lib_ldf_mode over, so they are
; repeated here: without them the vendored middleware is not compiled and the
; link fails with undefined references to sss_se05x_*.
lib_extra_dirs = vendor
lib_ldf_mode = deep+
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
; Mainnet = the SE050 tier + the production switches. The SE050 flags are pulled
; in by interpolation: PlatformIO's `extends` overrides list options instead of
; merging them, so build_flags has to be spelled out with ${env:...}.
build_flags =
    ${env:esp32dev-se050.build_flags}
    -D ENRG_MAINNET=1
    -D ENRG_MANIFEST_REQUIRED=1
    -D ENRG_ENABLE_HW_ANTI_ROLLBACK=1
    -D ENRG_SIGNER_PORT=8080
    -D ENRG_SIGNER_LAN_ONLY=1
