; ENRG Proof Sender v3 — PlatformIO конфигурация.
; Базовый env: ключ в NVS (без Secure Element). Для ATECC608:
;   pio run -e esp32dev-atecc   (требует установленную cryptoauthlib)
; Для NXP SE050 (аппаратная Ed25519-подпись):
;   pio run -e esp32dev-se050   (требует установленную библиотеку se050)
;
; Прошивка: firmware/esp32_proof_sender/src/esp32_proof_sender_v3/esp32_proof_sender_v3.ino
; (legacy v1/v2 удалены из git — лежат в firmware/legacy/, не собираются).

[platformio]
; Исходники лежат в подпапке src/esp32_proof_sender_v3/ (имя .ino == имя папки,
; как в Arduino IDE). Без этого PlatformIO ищет .ino прямо в src/.
src_dir = src/esp32_proof_sender_v3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D ENRG_SIGNER_PORT=8080
    -D ENRG_SIGNER_LAN_ONLY=1
    ; ── Облачный оракул: https://enrg-oracle.onrender.com
    ; URL и корневой CA заданы прямо в прошивке (конфиг-секция). ──

[env:esp32dev-atecc]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
    cryptoauthlib
build_flags =
    -D ENRG_USE_ATECC608=1

; NXP SE050 — полная аппаратная Ed25519-подпись (ADR-0001).
; ⚠️ Этот env НЕ СОБИРАЕТСЯ «из коробки», и это ожидаемо:
;    прошивка включает SSS-заголовки NXP (sss.h, fsl_sss_se05x_*.h), которых
;    нет в реестре PlatformIO. Пакет `se050` в реестре отсутствует
;    («Could not find the package»), поэтому middleware NXP Plug & Trust нужно
;    положить вручную в lib/ — см. SE050-HARDWARE-SIGNING.md §Vendoring.
;    Пока этого не сделано, сборка падает с внятным #error в .ino (а не с
;    «WiFiManager.h not found», как было до 2026-09-21).
; ⚠️ Требует плату с SE050 (I2C SDA/SCL: 21/22 по умолчанию).
[env:esp32dev-se050]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
    ; NXP Plug & Trust middleware (sss.h + fsl_sss_se05x_*) — НЕ реестровый
    ; пакет: vendor в lib/ (SE050-HARDWARE-SIGNING.md §Vendoring).
build_flags =
    -D ENRG_USE_SE050=1
    ; Раскомментируйте ПОСЛЕ vendoring middleware — это ваша письменная
    ; фиксация, что lib/ содержит sss.h (без неё сборка падает с #error):
    ; -D ENRG_SE050_MIDDLEWARE_VENDORED=1

; Dual-bank OTA + аппаратный анти-откат (ADR-0008).
; A/B (app0/app1 + otadata) + monotonic secure_version в eFuse.
; ⚠️ Требует ESP32 с 4MB flash; первый boot нового образа прожигает eFuse
;    (необратимо). Сборка: pio run -e esp32dev-ota
[env:esp32dev-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D ENRG_ENABLE_HW_ANTI_ROLLBACK=1
    -D ENRG_SIGNER_PORT=8080
    -D ENRG_SIGNER_LAN_ONLY=1

; ════════════════════════════════════════════════════════════════════════
;  MAINNET BUILD (P1-1, audit 2026-08-30)
;
;  The ONLY build permitted for production devices (ADR-0007 "conforming"
;  tier). Enforces, at compile time and at runtime:
;    * ENRG_MAINNET=1      → fail-closed: boot REQUIRES the NXP SE050
;                            (on-chip Ed25519) — no NVS/ATECC fallback;
;    * ENRG_MANIFEST_REQUIRED=1 → proofs are NOT sent without a valid,
;                            founder-signed Device Manifest (ADR-0004);
;    * A/B dual-bank + eFuse secure_version anti-rollback (ADR-0008).
;  Deployment MUST also enable secure boot v2 + flash encryption at
;  manufacturing (eFuse), see SE050-HARDWARE-SIGNING.md.
; ════════════════════════════════════════════════════════════════════════
[env:esp32dev-mainnet]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
lib_deps =
    rweather/Crypto@^0.4.0
    bblanchon/ArduinoJson@^7.3.1
    tzapu/WiFiManager@^2.0.17
    ; NXP Plug & Trust middleware (sss.h + fsl_sss_se05x_*) — НЕ реестровый
    ; пакет: vendor в lib/ (SE050-HARDWARE-SIGNING.md §Vendoring). До тех пор
    ; `pio run -e esp32dev-mainnet` падает с #error, и это правильно: главнет
    ; обязан требовать SE050, а не тихо собираться без него.
build_flags =
    -D ENRG_MAINNET=1
    -D ENRG_USE_SE050=1
    -D ENRG_MANIFEST_REQUIRED=1
    -D ENRG_ENABLE_HW_ANTI_ROLLBACK=1
    -D ENRG_SIGNER_PORT=8080
    -D ENRG_SIGNER_LAN_ONLY=1
    ; Раскомментируйте ПОСЛЕ vendoring middleware NXP (см. §Vendoring в
    ; SE050-HARDWARE-SIGNING.md). До этого главнет-сборка падает с #error —
    ; это и есть заявленное «mainnet не собирается без SE050»:
    ; -D ENRG_SE050_MIDDLEWARE_VENDORED=1
