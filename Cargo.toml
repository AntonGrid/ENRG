[workspace]
members = [
    "programs/enrg-mvp"
]
exclude = [
    "programs/enrg-profile"
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    "cfg(no_entrypoint)",
    "cfg(custom_heap)",
    "cfg(custom_panic)",
    "cfg(anchor_debug)",
    "cfg(no_idl)",
    "cfg(no_log_ix_name)",
] }

[profile.release]
opt-level = "z"
lto = true
debug = false
overflow-checks = true

[workspace.dependencies]
# Пинним proc-macro2 на версию, совместимую с anchor-syn 0.30.1
proc-macro2 = "=1.0.66"
crypto-common = "=0.1.6"

# Локальный патч anchor-spl: idl_build.rs корректно гейтит token_interface
# за фичей token_2022, чтобы можно было собирать с default-features = false
# (без spl-token-2022 → solana-zk-sdk → crypto-common 0.1.7, ломающего лимит стека).
[patch.crates-io]
anchor-spl = { path = "vendor/anchor-spl" }
