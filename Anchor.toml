[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
# ⚠️  program id ДОЛЖЕН совпадать с declare_id в programs/enrg-mvp/src/lib.rs
# И с pubkey deploy-ключа (target/deploy/enrg_mvp-keypair.json).
enrg_mvp = "HkuC3FTGAf9ryPqH7fi3RbUHwP4TKFMg5WgHNWm6Vaxb"

[programs.localnet]
enrg_mvp = "HkuC3FTGAf9ryPqH7fi3RbUHwP4TKFMg5WgHNWm6Vaxb"

# Anchor 0.32 принимает кластер "mainnet" (не "mainnet-beta").
[programs.mainnet]
enrg_mvp = "HkuC3FTGAf9ryPqH7fi3RbUHwP4TKFMg5WgHNWm6Vaxb"

[workspace]
# anchor-cli берёт workspace из Anchor.toml, а не из корневого Cargo.toml.
# Без этой секции он по умолчанию сканирует programs/* и цепляет
# enrg-profile, для которого сейчас нет .so в target/deploy.
members = ["programs/enrg-mvp"]
exclude = ["programs/enrg-profile"]

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Кавычки вокруг glob обязательны: без них bash (без globstar) раскроет
# tests/**/*.ts только в tests/helpers/*.ts, и реальные тесты не запустятся.
# В кавычках шаблон уходит в mocha, который сам делает рекурсивный glob.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"

[test]
# Валидатор на этой машине стартует медленно (~1.5-2 мин); дефолт 5s мал.
startup_wait = 180000
shutdown_wait = 5000

[test.validator]
# RPC-адрес, к которому anchor подключается (дефолт 0.0.0.0 → явно 127.0.0.1).
bind_address = "127.0.0.1"
# Генезис-аккаунт FounderVesting для initialize_founder_vesting.
# Аккаунт НЕ является PDA с init (state/vesting.rs) — он обязан существовать
# заранее (генезис). Адрес = findProgramAddress([b"founder-vesting"]) программы.
# Начиная с v7.1/block-8 программа умеет САМА создавать аккаунт (init_if_needed),
# генезис сохраняется для обратной совместимости localnet-тестов.
# См. docs/STATE.md, раздел 4. Smoke: tests/zz-e2e-smoke.ts.
account = [
  { address = "B5uSLeaX2keRGbkxZA1Tyb7dFwNpY7DUbVu8TgvdiMAh", filename = "tests/genesis/founder-vesting.json" },
  # H-2 / audit 2026-08-30: the founder wallet (EXPECTED_DEPLOYER) must be
  # funded in the local validator. `solana-test-validator` credits airdrops only
  # to --mint (the operator), so the bootstrap tests (governance.ts, the
  # zz-e2e-smoke FRESH path) can never fund the founder key via requestAirdrop.
  # Injecting 10 SOL at genesis makes the anchor suite deterministic.
  { address = "6gM2eEALvTD8ByMkAtawW8tfS5LEn7yFEcMh2Ly3nUN8", filename = "tests/genesis/founder-wallet.json" },
]

[hooks]
