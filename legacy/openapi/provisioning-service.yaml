openapi: 3.0.3
info:
  title: ENRG Provisioning Service API
  version: 0.1.0
  description: |
    Provisioning Service for device onboarding and bootstrap.

servers:
  - url: https://provisioning.example.com/api/v1

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /devices:
    post:
      summary: Provision a new device
      operationId: provisionDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../schemas/device-manifest.schema.json"
                - type: object
                  description: Device manifest plus optional owner and metadata for provisioning.
                  properties:
                    owner:
                      type: string
                      description: Logical owner (e.g. DID, account address).
                    metadata:
                      type: object
                      additionalProperties: true
      responses:
        '201':
          description: Device successfully provisioned
          content:
            application/json:
              schema:
                type: object
                required:
                  - device
                  - bootstrap_policy
                properties:
                  device:
                    $ref: "../schemas/device-record.schema.json"
                  bootstrap_policy:
                    type: object
                    description: Bootstrap policy snapshot for the device.
                    additionalProperties: true
        '400':
          description: Invalid manifest or request payload
        '409':
          description: Device already provisioned
        '500':
          description: Internal server error

  /devices/{device_id}:
    get:
      summary: Get provisioned device record
      operationId: getProvisionedDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            description: Device identifier (base58).
      responses:
        '200':
          description: Device record found
          content:
            application/json:
              schema:
                $ref: "../schemas/device-record.schema.json"
        '404':
          description: Device not found

  /devices/{device_id}/bootstrap:
    post:
      summary: Device bootstrap using a signed proof
      operationId: deviceBootstrap
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            description: Device identifier (base58).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/device-proof.schema.json"
      responses:
        '200':
          description: Bootstrap successful, returns minimal config/policy
          content:
            application/json:
              schema:
                type: object
                required:
                  - device
                  - bootstrap_policy
                properties:
                  device:
                    $ref: "../schemas/device-record.schema.json"
                  bootstrap_policy:
                    type: object
                    additionalProperties: true
        '400':
          description: Invalid proof
        '401':
          description: Proof verification failed
        '404':
          description: Device not found
        '409':
          description: Device state does not allow bootstrap
        '500':
          description: Internal server error

  /devices/{device_id}/attestations:
    post:
      summary: Submit attestation proof from device
      operationId: submitAttestation
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            description: Device identifier (base58).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/device-proof.schema.json"
      responses:
        '202':
          description: Attestation accepted for processing
        '400':
          description: Invalid attestation payload
        '401':
          description: Attestation verification failed
        '404':
          description: Device not found
        '500':
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []
