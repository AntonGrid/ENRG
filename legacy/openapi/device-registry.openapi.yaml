openapi: 3.0.3
info:
  title: ENRG Device Registry API
  version: 0.1.0
  description: >
    Off-chain single source of truth for devices.
    Contains no private keys, only public data and lifecycle.

servers:
  - url: https://registry.enrg.example.com

paths:
  /devices:
    get:
      summary: Search devices
      operationId: listDevices
      parameters:
        - in: query
          name: owner_id
          schema:
            type: string
        - in: query
          name: manufacturer_id
          schema:
            type: string
        - in: query
          name: model
          schema:
            type: string
        - in: query
          name: lifecycle_state
          schema:
            type: string
            enum: [provisioned, active, suspended, retired]
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceRecord'
                  next_cursor:
                    type: string
                    nullable: true

    post:
      summary: Create a device record (usually via the Provisioning Service)
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRecordCreate'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRecord'

  /devices/{device_id}:
    get:
      summary: Get a device by device_id
      operationId: getDeviceById
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRecord'
        '404':
          description: Not found

    patch:
      summary: Partially update a device (lifecycle, firmware_version, etc.)
      operationId: patchDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRecordPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRecord'
        '409':
          description: Version conflict (optimistic locking on version)

components:
  schemas:
    DeviceOwnerInfo:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [organization, individual]
        id:
          type: string
        onchain_account:
          type: string
          nullable: true

    DeviceManufacturerInfo:
      type: object
      required: [id, model, serial_number]
      properties:
        id:
          type: string
        model:
          type: string
        serial_number:
          type: string

    DeviceCapabilities:
      type: object
      properties:
        sensors:
          type: array
          items:
            type: string
        actuators:
          type: array
          items:
            type: string

    DeviceMetadata:
      type: object
      additionalProperties: true

    DeviceRecordBase:
      type: object
      required:
        - device_id
        - public_key
        - owner
        - lifecycle_state
        - firmware_version
        - manifest_ref
      properties:
        device_id:
          type: string
          description: Deterministic identifier (based on public_key + manufacturing attributes)
        public_key:
          type: string
          description: Device Ed25519 public key
        owner:
          $ref: '#/components/schemas/DeviceOwnerInfo'
        lifecycle_state:
          type: string
          enum: [provisioned, active, suspended, retired]
        manufacturer:
          $ref: '#/components/schemas/DeviceManufacturerInfo'
        firmware_version:
          type: string
        manifest_ref:
          type: string
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilities'
        metadata:
          $ref: '#/components/schemas/DeviceMetadata'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Record version for optimistic locking

    DeviceRecord:
      allOf:
        - $ref: '#/components/schemas/DeviceRecordBase'

    DeviceRecordCreate:
      allOf:
        - $ref: '#/components/schemas/DeviceRecordBase'

    DeviceRecordPatch:
      type: object
      properties:
        lifecycle_state:
          type: string
          enum: [provisioned, active, suspended, retired]
        firmware_version:
          type: string
        manifest_ref:
          type: string
        metadata:
          $ref: '#/components/schemas/DeviceMetadata'
        version:
          type: integer
          description: Currently known record version (race protection)
