openapi: 3.0.3
info:
  title: ENRG Device Provisioning & Registry API
  version: "0.1.0"
  description: |
    Combined API for:
    - Provisioning Service (device bootstrap, proofs)
    - Device Registry (manifests, device records, attestations)

servers:
  - url: https://provisioning.enrg.local
    description: Provisioning Service
  - url: https://registry.enrg.local
    description: Device Registry

paths:
  /manifests:
    post:
      summary: Create or register a new device manifest
      tags: [Manifests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/device-manifest.schema.json"
      responses:
        "201":
          description: Manifest created
          content:
            application/json:
              schema:
                $ref: "../schemas/device-manifest.schema.json"
        "400":
          description: Invalid manifest payload

  /manifests/{manifest_id}:
    get:
      summary: Get device manifest by manifest_id
      tags: [Manifests]
      parameters:
        - name: manifest_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manifest found
          content:
            application/json:
              schema:
                $ref: "../schemas/device-manifest.schema.json"
        "404":
          description: Manifest not found

  /devices:
    post:
      summary: Provision device using a provisioning proof
      description: |
        Accepts a DeviceProof of type "provisioning" from the device.
        The Provisioning Service verifies the proof, creates/updates
        a DeviceRecord in the Device Registry and returns bootstrap policy.
      tags: [Provisioning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/device-proof.schema.json"
      responses:
        "201":
          description: Device provisioned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  device:
                    $ref: "../schemas/device-record.schema.json"
                  bootstrap_policy:
                    type: object
                    description: Bootstrap policy snapshot for the device
                    additionalProperties: true
                required:
                  - device
        "400":
          description: Invalid proof
        "401":
          description: Signature verification failed

  /devices/{device_id}:
    get:
      summary: Get device record by device_id
      tags: [Devices]
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device record
          content:
            application/json:
              schema:
                $ref: "../schemas/device-record.schema.json"
        "404":
          description: Device not found

  /devices/{device_id}/bootstrap:
    post:
      summary: Submit bootstrap proof
      description: |
        Device submits a DeviceProof of type "bootstrap" after initial provisioning.
      tags: [Provisioning]
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/device-proof.schema.json"
      responses:
        "200":
          description: Bootstrap proof accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  device:
                    $ref: "../schemas/device-record.schema.json"
                  policy:
                    type: object
                    description: Updated policy snapshot (if any)
                    additionalProperties: true
        "400":
          description: Invalid proof
        "401":
          description: Signature verification failed

  /devices/{device_id}/attestations:
    post:
      summary: Submit regular attestation proof
      description: |
        Device submits a DeviceProof of type "attestation".
        Downstream components (Policy Engine, Oracle) may consume these.
      tags: [Attestations]
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/device-proof.schema.json"
      responses:
        "202":
          description: Attestation accepted for processing
        "400":
          description: Invalid proof
        "401":
          description: Signature verification failed

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
