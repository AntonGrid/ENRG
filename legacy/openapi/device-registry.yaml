openapi: 3.0.3
info:
  title: ENRG Device Registry API
  version: 0.1.0
  description: |
    Device Registry as the canonical source of truth for device identity and lifecycle.

servers:
  - url: https://registry.example.com/api/v1

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /devices:
    get:
      summary: List devices with optional filters
      operationId: listDevices
      parameters:
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: lifecycle_state
          in: query
          required: false
          schema:
            type: string
            enum:
              - provisioned
              - active
              - suspended
              - quarantined
              - retired
              - revoked
        - name: manifest_ref
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/device-record.schema.json"
                  total:
                    type: integer

    post:
      summary: Create or upsert a device record
      operationId: createOrUpdateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/device-record.schema.json"
      responses:
        '201':
          description: Device record created
          content:
            application/json:
              schema:
                $ref: "../schemas/device-record.schema.json"
        '200':
          description: Device record updated
          content:
            application/json:
              schema:
                $ref: "../schemas/device-record.schema.json"
        '400':
          description: Invalid payload
        '500':
          description: Internal server error

  /devices/{device_id}:
    get:
      summary: Get device by ID
      operationId: getDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            description: Device identifier (base58).
      responses:
        '200':
          description: Device record
          content:
            application/json:
              schema:
                $ref: "../schemas/device-record.schema.json"
        '404':
          description: Device not found

    patch:
      summary: Partially update a device record
      operationId: patchDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial update; fields follow DeviceRecord shape.
              additionalProperties: true
      responses:
        '200':
          description: Updated device record
          content:
            application/json:
              schema:
                $ref: "../schemas/device-record.schema.json"
        '400':
          description: Invalid patch payload
        '404':
          description: Device not found

    delete:
      summary: Delete a device record (administrative)
      operationId: deleteDevice
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Device deleted
        '404':
          description: Device not found

  /devices/{device_id}/lifecycle:
    post:
      summary: Change lifecycle state of a device
      operationId: changeLifecycle
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_state
                - to_state
                - reason
              properties:
                from_state:
                  type: string
                to_state:
                  type: string
                  enum:
                    - provisioned
                    - active
                    - suspended
                    - quarantined
                    - retired
                    - revoked
                reason:
                  type: string
                  minLength: 1
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Lifecycle updated
          content:
            application/json:
              schema:
                $ref: "../schemas/device-record.schema.json"
        '400':
          description: Invalid transition
        '404':
          description: Device not found

  /devices/{device_id}/attestations:
    get:
      summary: List attestations for device (optional, registry view)
      operationId: listDeviceAttestations
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of attestations
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/device-proof.schema.json"
                  total:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []
