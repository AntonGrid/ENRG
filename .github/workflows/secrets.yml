name: Secret scanning

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the checked-out tree (no leaks in tracked files)
        # `--no-git` is what makes this a *tree* scan. Without it gitleaks walks
        # the whole commit history (481 commits -> 25 findings) and the check can
        # never pass: the historical leaks (founder-wallet.json at d3664c1 and
        # friends) were handled by key rotation — see MAINNET-CHECKLIST.md and
        # docs/AUTHORITY-ROTATION-2026-09-16.md. With the flag: 9 findings before
        # .gitleaks.toml, 0 after (all nine were synthetic example values).
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
