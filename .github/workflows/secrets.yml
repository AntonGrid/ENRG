name: Secret scanning

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree (no new leaks)
        # Scans the committed tree only. Historical leaks (e.g. founder-wallet.json
        # at d3664c1) are handled by key rotation — see MAINNET-CHECKLIST.md.
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
