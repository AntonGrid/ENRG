name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # anchorpy's pytest plugin needs pytest-asyncio and pytest-xprocess.
          pip install pytest jsonschema eth-abi eth-utils pytest-asyncio pytest-xprocess

      - name: Run tests
        # The ENRG python tests are ENRG-specific (tokenomics/mainnet-critical
        # simulations) and no longer import the shared axis_core package —
        # the duplicate Axis-core tests were removed in favour of the canonical
        # suite in the Axis-core repository.
        run: pytest -q -p no:anchorpy

  rust:
    name: Rust unit tests (cargo test -p enrg-mvp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run host-side unit tests
        # Host-side unit/integration tests of the crate (math, emission curves,
        # message formats). No validator required.
        run: cargo test -p enrg-mvp

  node:
    name: Node oracle tests (mocha, incl. spawn-based suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native binding (better-sqlite3)
        # The spawn-based suites (manifest, firmware, keyrotation) start the
        # oracle server (server.js), which loads the better-sqlite3 native
        # binding. npm ci installs the prebuilt binary, which may target a
        # different NODE_MODULE_VERSION; rebuilding from source fixes
        # "NODE_MODULE_VERSION mismatch" / "server did not start in time".
        # See tests/manifest.test.js.
        run: npm rebuild better-sqlite3

      - name: Audit dependencies
        # Reports known vulnerabilities without failing the build.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run oracle tests (all suites)
        # policy (43) and mint (4) are pure JS; manifest (11), firmware (12)
        # and keyrotation (6) spawn the oracle server and exercise the signed
        # manifest, OTA and key-rotation flows end-to-end.
        run: |
          npm run test:policy
          npm run test:mint
          npm run test:manifest
          npm run test:firmware
          npm run test:keyrotation

  anchor:
    name: Anchor program tests (anchor test, local validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Solana CLI
        # Official Anza release channel (release.solana.com is EOL/redirecting).
        run: |
          curl -sSfL https://release.anza.xyz/v2.1.0/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Set up Anchor CLI
        # Prebuilt Anchor v0.32.1 binary for linux x86_64.
        run: |
          curl -sSfL -o /tmp/anchor https://github.com/otter-sec/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu
          chmod +x /tmp/anchor
          sudo mv /tmp/anchor /usr/local/bin/anchor
          anchor --version

      - name: Install dependencies
        run: npm ci

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build program and run on-chain tests
        # Builds the enrg-mvp program, spawns a local Solana validator with the
        # genesis founder-vesting account (Anchor.toml [test.validator]), and
        # runs the TypeScript integration suite (56 tests: lifecycle,
        # governance, vesting, merkle proofs, trust/ERS pool, E2E smoke).
        run: anchor test


  forge:
    name: Foundry tests (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: cd onchain && forge test

