name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The ENRG python tests import the shared axis_core package.
          # Pinned for CI reproducibility; bump deliberately.
          # Pinned to the last commit before the Axis-core security hardening
          # (anti-replay, PoP, oracle signing): the ENRG python tests are stale
          # duplicates of Axis-core's and are incompatible with the hardened API
          # until they are deduplicated.
          pip install "git+https://github.com/AntonGrid/Axis-core.git@b71c4e6620b1c6135ce7a791a46bea7e107ef16e"
          # anchorpy's pytest plugin needs pytest-asyncio and pytest-xprocess.
          pip install pytest jsonschema eth-abi eth-utils pytest-asyncio pytest-xprocess

      - name: Run tests
        # AXIS_ALLOW_MOCK=1 enables the dev-only mock signature algorithm used
        # by the legacy test fixtures (production mode stays mock_disabled).
        # The test `test_attestation_deny_example_validates_against_schema` reads
        # the schema from a sibling `../Axis-core` checkout (workspace layout);
        # it is deselected here — schema coverage lives in the Axis-core repo.
        run: AXIS_ALLOW_MOCK=1 pytest -q -p no:anchorpy -k 'not attestation_deny_example_validates_against_schema'

  rust:
    name: Rust unit tests (cargo test -p enrg-mvp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run host-side unit tests
        # Host-side unit/integration tests of the crate (math, emission curves,
        # message formats). No validator required.
        run: cargo test -p enrg-mvp

  node:
    name: Node oracle tests (mocha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run oracle tests (no validator / no external network)
        env:
          # Force the spawned oracle servers to fail fast (connection refused)
          # instead of hanging on the public devnet RPC. The tests assert the
          # "not registered on-chain" error path, which the oracle returns when
          # it cannot reach the on-chain registry.
          RPC_ENDPOINT: "http://127.0.0.1:1"
        run: |
          npm run test:policy
          npm run test:manifest
          npm run test:firmware
          npm run test:keyrotation
          npm run test:mint

  forge:
    name: Foundry tests (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: cd onchain && forge test

