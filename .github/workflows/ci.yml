name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # anchorpy's pytest plugin needs pytest-asyncio and pytest-xprocess.
          pip install pytest jsonschema eth-abi eth-utils pytest-asyncio pytest-xprocess

      - name: Run tests
        # The ENRG python tests are ENRG-specific (tokenomics/mainnet-critical
        # simulations) and no longer import the shared axis_core package —
        # the duplicate Axis-core tests were removed in favour of the canonical
        # suite in the Axis-core repository.
        run: pytest -q -p no:anchorpy

  rust:
    name: Rust unit tests (cargo test -p enrg-mvp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run host-side unit tests
        # Host-side unit/integration tests of the crate (math, emission curves,
        # message formats). No validator required.
        run: cargo test -p enrg-mvp

  node:
    name: Node oracle tests (mocha, incl. spawn-based suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native binding (better-sqlite3)
        # The spawn-based suites (manifest, firmware, keyrotation) start the
        # oracle server (server.js), which loads the better-sqlite3 native
        # binding. npm ci installs the prebuilt binary, which may target a
        # different NODE_MODULE_VERSION; rebuilding from source fixes
        # "NODE_MODULE_VERSION mismatch" / "server did not start in time".
        # See tests/manifest.test.js.
        run: npm rebuild better-sqlite3

      - name: Audit dependencies
        # Reports known vulnerabilities without failing the build.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Run oracle tests (all suites)
        # policy (43) and mint (4) are pure JS; manifest (11), firmware (12)
        # and keyrotation (6) spawn the oracle server and exercise the signed
        # manifest, OTA and key-rotation flows end-to-end.
        run: |
          # All hermetic Node suites (policy, conformance, mint, manifest, firmware,
          # key rotation, oracle quorum, webcrypto, storage queue). The validator-backed
          # TypeScript suite is a separate script: `npm run test:integration`.
          npm test

      - name: Check the published API spec against server.js
        # docs/openapi.json is generated from server.js (scripts/generate-openapi.js).
        # This fails when a route is added, renamed or removed without updating the
        # spec — the exact drift that produced eight mock specs describing an API
        # nobody ran (audit 2026-09-21).
        run: npm run openapi:check

      - name: Check the wire-format vectors against policy.js
        # sdk/vectors/wire_format.json is what the JS and Python SDKs are both
        # tested against; it is generated from policy.js (the mirror the Rust
        # conformance vectors pin). If policy.js changes, the vectors must be
        # regenerated in the same commit.
        run: npm run wire:vectors:check

  anchor:
    name: Anchor program tests (anchor test, local validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Solana CLI
        # Official Anza release channel (release.solana.com is EOL/redirecting).
        run: |
          curl -sSfL https://release.anza.xyz/v2.1.0/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Set up Anchor CLI
        # Prebuilt Anchor v0.32.1 binary for linux x86_64.
        run: |
          curl -sSfL -o /tmp/anchor https://github.com/otter-sec/anchor/releases/download/v0.32.1/anchor-0.32.1-x86_64-unknown-linux-gnu
          chmod +x /tmp/anchor
          sudo mv /tmp/anchor /usr/local/bin/anchor
          anchor --version

      - name: Install dependencies
        run: npm ci

      - name: Install Yarn
        run: npm install -g yarn

      - name: Restore the localnet program keypair
        # Why this exists (audit 2026-09-21): the program id is part of the
        # interface — `declare_id!`, Anchor.toml and the integration tests all pin
        # HkuC3FT… — but `target/` is gitignored, so a CI checkout has no
        # `target/deploy/enrg_mvp-keypair.json`. `anchor build` then generates a
        # RANDOM keypair, the program deploys under a different address, and every
        # test that pins the id fails. That is why this job was red on 30+
        # consecutive runs from 2026-08-31 to 2026-09-21 while `anchor test`
        # passed locally (where the keypair exists).
        #
        # Fix: put the JSON array of `target/deploy/enrg_mvp-keypair.json` into the
        # repository secret ENRG_MVP_PROGRAM_KEYPAIR. This is the *program id*
        # keypair, NOT the upgrade authority (rotated to H3tXm4… on 2026-09-16), so
        # it controls nothing on devnet/mainnet — it only makes the local validator
        # deploy the program at the address the tests expect.
        #
        # The check is done in the shell, not with `if: secrets.X`: the `secrets`
        # context is not allowed in a step `if`, and using it there made GitHub
        # reject the whole workflow (zero jobs) instead of running it.
        env:
          PROGRAM_KEYPAIR: ${{ secrets.ENRG_MVP_PROGRAM_KEYPAIR }}
        run: |
          if [ -z "$PROGRAM_KEYPAIR" ]; then
            echo "::error::ENRG_MVP_PROGRAM_KEYPAIR is not set. Without it the program would be built with a random id and every test that pins HkuC3FT… would fail."
            echo "Set the repository secret to the JSON of target/deploy/enrg_mvp-keypair.json — 'solana-keygen pubkey' on it must print HkuC3FTGAf9ryPqH7fi3RbUHwP4TKFMg5WgHNWm6Vaxb."
            exit 1
          fi
          mkdir -p target/deploy
          printf '%s' "$PROGRAM_KEYPAIR" > target/deploy/enrg_mvp-keypair.json
          echo "restored program keypair: $(solana-keygen pubkey target/deploy/enrg_mvp-keypair.json)"

      - name: Build program and run on-chain tests
        # Builds the enrg-mvp program, spawns a local Solana validator with the
        # genesis founder-vesting account (Anchor.toml [test.validator]), and runs
        # the TypeScript integration suite. Measured locally on 2026-09-21:
        # 55 passing, 4 pending in 69 s.
        run: anchor test


  forge:
    name: Foundry tests (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: cd onchain && forge test

  authorities:
    name: Protocol authority guard (read-only)
    # P0-1b guard: fails when a key that leaked in the public git history still
    # holds an on-chain role. Runs on pushes to main only — the cluster state is
    # an external dependency and must not block pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Verify no forbidden key holds a protocol role
        # Read-only: no keypair, no transactions. Exit 1 = a banned key holds a
        # role; exit 2 = the program is not deployed at this endpoint.
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          TS_NODE_TRANSPILE_ONLY: "1"
        run: npx ts-node scripts/verify-authorities.ts

