name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # anchorpy's pytest plugin needs pytest-asyncio and pytest-xprocess.
          pip install pytest jsonschema eth-abi eth-utils pytest-asyncio pytest-xprocess

      - name: Run tests
        run: pytest -q -p no:anchorpy
