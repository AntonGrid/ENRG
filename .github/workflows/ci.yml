name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # anchorpy's pytest plugin needs pytest-asyncio and pytest-xprocess.
          pip install pytest jsonschema eth-abi eth-utils pytest-asyncio pytest-xprocess

      - name: Run tests
        # The ENRG python tests are ENRG-specific (tokenomics/mainnet-critical
        # simulations) and no longer import the shared axis_core package —
        # the duplicate Axis-core tests were removed in favour of the canonical
        # suite in the Axis-core repository.
        run: pytest -q -p no:anchorpy

  rust:
    name: Rust unit tests (cargo test -p enrg-mvp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run host-side unit tests
        # Host-side unit/integration tests of the crate (math, emission curves,
        # message formats). No validator required.
        run: cargo test -p enrg-mvp

  node:
    name: Node oracle tests (mocha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # test:manifest, test:firmware and test:keyrotation are intentionally NOT
      # run here: they spawn the oracle server (server.js), which requires the
      # better-sqlite3 native binding. That binding fails to load on the
      # ubuntu-latest runner ("server did not start in time") on both Node 20
      # and Node 24. Only the pure-JS suites (policy, mint) run in CI; the full
      # set (76 tests) passes locally. Re-enable the spawn-based suites once the
      # native dependency is resolved.
      - name: Run oracle tests (pure JS)
        run: |
          npm run test:policy
          npm run test:mint

  forge:
    name: Foundry tests (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: cd onchain && forge test

