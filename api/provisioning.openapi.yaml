openapi: 3.0.3
info:
  title: ENRG Provisioning Service API
  version: 0.1.0
  description: >
    Device provisioning / onboarding in ENRG.
    All cryptography and identity go through Ed25519; provisioning is built around challenge/response.

servers:
  - url: https://provisioning.enrg.example.com

paths:
  /provisioning/start:
    post:
      summary: Start the provisioning flow (create provisioning_id and challenge)
      operationId: startProvisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningStartRequest'
      responses:
        '200':
          description: Provisioning session created, challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningStartResponse'
        '400':
          description: Invalid request (required fields missing)
        '409':
          description: Conflict (e.g., a device with this serial is already bound)

  /provisioning/complete:
    post:
      summary: Complete provisioning using the device signature
      operationId: completeProvisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningChallengeResponse'
      responses:
        '200':
          description: Device successfully registered in the Device Registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningCompleteResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid signature/attestation
        '410':
          description: Provisioning session expired or not found

components:
  schemas:
    ManufacturerInfo:
      type: object
      required: [id, model, serial_number]
      properties:
        id:
          type: string
        model:
          type: string
        serial_number:
          type: string

    OwnerInfo:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [organization, individual]
        id:
          type: string
        onchain_account:
          type: string
          nullable: true
          description: Owner on-chain account (e.g., a Solana address)

    ProvisioningStartRequest:
      type: object
      required:
        - manufacturer
        - owner
        - device_public_key
        - claimed_manifest_ref
      properties:
        manufacturer:
          $ref: '#/components/schemas/ManufacturerInfo'
        owner:
          $ref: '#/components/schemas/OwnerInfo'
        device_public_key:
          type: string
          description: Device Ed25519 public key (prefix+base58/base64 format, TBD)
        claimed_manifest_ref:
          type: string
          description: Reference to the expected Device Manifest (URN/URL)
        context:
          type: object
          additionalProperties: true

    ProvisioningStartResponse:
      type: object
      required:
        - provisioning_id
        - challenge
        - expected_manifest_ref
      properties:
        provisioning_id:
          type: string
        device_id:
          type: string
          nullable: true
          description: >
            May be null at the start; the final device_id appears after complete.
        challenge:
          type: object
          required: [nonce, expires_at]
          properties:
            nonce:
              type: string
            expires_at:
              type: string
              format: date-time
        expected_manifest_ref:
          type: string

    AttestationSignature:
      type: object
      required:
        - alg
        - public_key
        - signature
      properties:
        alg:
          type: string
          enum: [Ed25519]
        public_key:
          type: string
        signature:
          type: string

    DeviceProvisioningAttestationPayload:
      type: object
      required:
        - nonce
        - timestamp
        - firmware_version
        - manifest_ref
      properties:
        nonce:
          type: string
        timestamp:
          type: string
          format: date-time
        firmware_version:
          type: string
        manifest_ref:
          type: string

    DeviceProvisioningAttestation:
      type: object
      required:
        - schema_version
        - payload
        - signature
      properties:
        schema_version:
          type: string
        payload:
          $ref: '#/components/schemas/DeviceProvisioningAttestationPayload'
        signature:
          $ref: '#/components/schemas/AttestationSignature'

    ProvisioningChallengeResponse:
      type: object
      required:
        - provisioning_id
        - device_public_key
        - attestation
      properties:
        provisioning_id:
          type: string
        device_public_key:
          type: string
        attestation:
          $ref: '#/components/schemas/DeviceProvisioningAttestation'

    ProvisioningCompleteResponse:
      type: object
      required:
        - device_id
        - manifest_ref
        - bootstrap_policy
      properties:
        device_id:
          type: string
        manifest_ref:
          type: string
        bootstrap_policy:
          type: object
          description: >
            Minimal set of policies/permissions the device must apply at startup.
            (The format will be refined by the Policy Engine.)
          additionalProperties: true
        provisioning_proof:
          type: object
          description: >
            Canonical ProvisioningProof that PS/Oracle may publish to DR/on-chain.
          additionalProperties: true
