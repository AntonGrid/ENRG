# Gitleaks configuration for ENRG.
#
# CI runs `gitleaks detect --no-git --config .gitleaks.toml` on a fresh checkout
# (tracked files only). Measured with gitleaks 8.18.4 on 2026-09-18:
#   * full history (481 commits)                      -> 25 findings
#   * checked-out tree, without this allowlist        ->  9 findings
#   * checked-out tree, with this allowlist           ->  0 findings
#
# Every entry below is a synthetic value that the `generic-api-key` rule reads
# as a secret: fake device keys in examples, genesis fixtures that contain only
# a public key and an account stub, documentation snippets and shell variables
# whose *name* ends in KEY. No real key material is allowlisted — a genuine
# secret anywhere (including in these paths) still fails the check, because the
# allowlist matches on the specific synthetic lines below.
title = "ENRG"

[extend]
useDefault = true

[allowlist]
description = "Synthetic identifiers in examples, fixtures, docs and env-var names"
regexes = [
  # `<something>key": "<synthetic value>` inside examples/fixtures/docs
  '''(?i)key": ?"[A-Za-z0-9:_.\-]{8,}"''',
  # shell/env variable *names* containing KEY (values are file paths or empty)
  '''(?i)(KEYPAIR|KEY)[A-Z_]*="?[~/.$A-Za-z0-9_\-/.<>]{0,60}"?''',
]
paths = [
  '''examples/.*\.json$''',
  '''device-manifest-example\.json$''',
  '''device-record-example\.json$''',
  '''tests/genesis/.*\.json$''',
  '''docs/.*\.md$''',
  '''scripts/devnet-upgrade\.sh$''',
  '''oracle/registry/README\.md$''',
  '''oracle/registry/test/registry\.test\.js$''',
]
